<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Button that changes text or color -->
        <button id="myButton">Click Me!</button>

        <!-- Image gallery or slideshow -->
        <div id="gallery">
            <!-- <img src="beach.jpg" alt="Image 1" class="gallery-image" />
            <img src="Chill.jpg" alt="Image 2" class="gallery-image" /> -->
            <img src="Tembea.jpg" alt="Image 3" class="gallery-image" />
        </div>

        <!-- Accordion content -->
        <div class="accordion">
            <button class="accordion-toggle">Home</button>
            <div class="accordion-content">Home section</div>

            <button class="accordion-toggle">Contacts</button>
            <div class="accordion-content">Various Channels To Reach Us.</div>

            <button class="accordion-toggle">Media</button>
            <div class="accordion-content">Content for Media Center .</div>
        </div>

        <!-- Form with validation -->
        <form id="myForm" onsubmit="return validateForm()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <br>
            <span id="passwordFeedback"></span>
            <br>

            <input type="submit" value="Submit">
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
